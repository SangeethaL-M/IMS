<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aju Store | Inventory Management</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #000000; }
        
        .sidebar-link { transition: all 0.2s; color: #000000; font-weight: 700; padding: 14px; border-radius: 16px; display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .sidebar-link.active { background: #10b981; color: white !important; box-shadow: 0 10px 15px rgba(16,185,129,0.2); }

        /* Stats Section */
        .stat-card { background: white; padding: 24px; border-radius: 28px; border: 2px solid transparent; display: flex; flex-direction: column; justify-content: center; }
        .stat-green { border-color: #10b981; box-shadow: 0 15px 30px rgba(16, 185, 129, 0.1); }
        .stat-blue { border-color: #3b82f6; box-shadow: 0 15px 30px rgba(59, 130, 246, 0.1); }
        .stat-orange { border-color: #f59e0b; box-shadow: 0 15px 30px rgba(245, 158, 11, 0.1); }
        .stat-red { border-color: #f43f5e; box-shadow: 0 15px 30px rgba(244, 63, 94, 0.1); }

        /* Refined Text Thickness */
        .refined-text { color: #000000 !important; font-weight: 500; }
        .bold-text { color: #000000 !important; font-weight: 700; }
        .head-black { color: #000000 !important; font-weight: 800; text-transform: uppercase; }
        
        .chart-box { background: white; padding: 24px; border-radius: 3rem; border: 2px solid #f1f5f9; min-height: 380px; }
    </style>
</head>
<body class="flex min-h-screen">
    <aside class="w-72 bg-white border-r p-6 flex flex-col gap-2 shrink-0">
        <div class="flex items-center gap-3 mb-10 px-2">
            <div class="bg-emerald-500 w-10 h-10 rounded-2xl flex items-center justify-center text-white shadow-lg"><i class="bi bi-shop"></i></div>
            <h1 class="font-extrabold text-xl head-black">Aju Store</h1>
        </div>
        <nav class="flex flex-col gap-2">
            <a href="index.html" class="sidebar-link active"><i class="bi bi-grid-1x2"></i> Dashboard</a>
            <a href="expiry.html" class="sidebar-link"><i class="bi bi-calendar3"></i> All Expiry</a>
            <a href="near-expiry.html" class="sidebar-link"><i class="bi bi-hourglass-split"></i> Near Expiry</a>
            <a href="suppliers.html" class="sidebar-link"><i class="bi bi-truck"></i> Suppliers</a>
            <a href="results.html" class="sidebar-link"><i class="bi bi-file-earmark-bar-graph"></i> Results</a>
        </nav>
    </aside>

    <main class="flex-1 p-8 space-y-8 overflow-y-auto">
        <header class="flex justify-between items-center">
            <h3 class="text-2xl font-black head-black">AJU - Inventory Management System</h3>
            <div class="flex gap-4">
                <div class="bg-white border-2 border-slate-200 px-5 py-3 rounded-2xl flex items-center gap-3 w-96 shadow-sm">
                    <i class="bi bi-search text-black"></i>
                    <input type="text" id="searchInput" onkeyup="multiSearch()" placeholder="Search Name, Category, Price, Invoice..." class="bg-transparent outline-none w-full text-black font-medium">
                </div>
                <button onclick="openModal()" class="bg-emerald-500 text-white px-2 py-2 rounded-2xl font-black shadow-xl hover:bg-emerald-600 transition-all">+ Add Stock</button>
            </div>
        </header>

        <div class="grid grid-cols-4 gap-6">
            <div class="stat-card stat-green">
                <p class="text-[11px] font-black uppercase text-slate-500">Products</p>
                <h4 id="stat-total" class="text-4xl head-black">0</h4>
            </div>
            <div class="stat-card stat-blue">
                <p class="text-[11px] font-black uppercase text-slate-500">Value</p>
                <h4 id="stat-value" class="text-4xl head-black">₹0</h4>
            </div>
            <div class="stat-card stat-orange">
                <p class="text-[11px] font-black uppercase text-slate-500">Low Stock</p>
                <h4 id="stat-low" class="text-4xl head-black">0</h4>
            </div>
            <div class="stat-card stat-red">
                <p class="text-[11px] font-black uppercase text-slate-500">Expired</p>
                <h4 id="stat-expired" class="text-4xl head-black">0</h4>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-6">
            <div class="chart-box">
                <h3 class="text-xs font-black uppercase mb-4 head-black">Top Stock Levels</h3>
                <div class="h-64"><canvas id="barChart"></canvas></div>
            </div>
            <div class="chart-box">
                <h3 class="text-xs font-black uppercase mb-4 head-black">Category Split</h3>
                <div class="h-64"><canvas id="pieChart"></canvas></div>
            </div>
        </div>

        <div class="bg-white rounded-[2rem] lg:rounded-[3rem] border-2 border-slate-100 shadow-md overflow-x-auto">
    <table class="w-full text-left min-w-[1000px] border-collapse">
                <thead class="bg-slate-50 border-b-2 border-slate-100">
                    <tr class="text-[11px] head-black">
                        <th class="p-6">Barcode</th>
                        <th class="p-6">Invoice #</th>
                        <th class="p-6">SKU</th>
                        <th class="p-6">Name</th>
                        <th class="p-6">Category</th>
                        <th class="p-6">Stock</th>
                        <th class="p-6">Price</th>
                        <th class="p-6">EXP</th>
                        <th class="p-6 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="inventoryTable" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </main>

    <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center p-4 z-[999]">
        <form id="productForm" class="bg-white p-10 rounded-[3.5rem] w-full max-w-xl shadow-2xl relative">
            <button type="button" onclick="closeModal()" class="absolute top-8 right-8 text-slate-300 hover:text-red-500 text-4xl"><i class="bi bi-x-circle-fill"></i></button>
            <h3 id="modalTitle" class="text-3xl font-black mb-8 head-black">Item Details</h3>
            <input type="hidden" id="editIndex" value="-1">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] font-bold uppercase ml-2">Invoice #</label>
                    <input type="text" id="pInvoice" class="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl refined-text" required>
                </div>
                
                <div class="col-span-2">
                    <label class="text-[10px] font-bold uppercase ml-2">Product Name</label>
                    <input type="text" id="pName" class="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl refined-text" required>
                </div>
                <div>
                    <label class="text-[10px] font-bold uppercase ml-2">Category</label>
                    <select id="pCat" class="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl refined-text"></select>
                </div>
                <div>
                    <label class="text-[10px] font-bold uppercase ml-2">Qty & Unit</label>
                    <div class="flex gap-2">
                        <input type="number" id="pQty" class="w-2/3 p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl refined-text" required>
                        <select id="pUnit" class="w-1/3 p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl font-bold">
                            <option value="pcs">pcs</option><option value="kg">kg</option><option value="L">L</option><option value="pkt">pkt</option>
                        </select>
                    </div>
                </div>
                <div>
    <label class="text-[10px] font-bold uppercase ml-2">Price (₹)</label>
    <input type="number" id="pPrice" class="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl refined-text" required>
</div>
<div>
    <label class="text-[10px] font-bold uppercase ml-2">MFG Date</label>
    <input type="date" id="pMfg" class="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl refined-text">
</div>
                
                <div>
                    <label class="text-[10px] font-bold uppercase ml-2">EXP Date</label>
                    <input type="date" id="pExp" class="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl refined-text" required>
            </div>
            </div>
            <button type="submit" class="w-full mt-8 py-5 bg-emerald-500 text-white rounded-2xl font-black text-xl shadow-lg hover:scale-[1.02] transition-transform">SAVE CHANGES</button>
        </form>
    </div>

    <script src="Assets/js/script.js"></script>
</body>
</html>
